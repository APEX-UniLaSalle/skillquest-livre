<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillQuest — La quête des compétences · Édition 2026-2027</title>
<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
  :root { --navy:#322838; --parchemin:#F4EDDC; --or:#DFA35C; --rouge:#B05548; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--navy); font-family:Georgia,'Times New Roman',serif; color:var(--parchemin);
         min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { padding:14px 16px 6px; text-align:center; }
  header h1 { font-size:1.05rem; letter-spacing:.14em; font-weight:normal; text-transform:uppercase; }
  header h1 b { color:var(--rouge); font-weight:normal; }
  header p { font-size:.72rem; color:var(--or); letter-spacing:.2em; text-transform:uppercase; margin-top:3px; }
  #book-wrap { flex:1; width:100%; display:flex; justify-content:center; align-items:center; padding:10px 8px; }
  #book { box-shadow:0 18px 60px rgba(0,0,0,.55); }
  .page img { width:100%; height:100%; object-fit:cover; display:block; }
  nav { display:flex; gap:10px; align-items:center; padding:10px 0 16px; flex-wrap:wrap; justify-content:center; }
  nav button, nav a, #zv button { background:transparent; border:1px solid var(--or); color:var(--parchemin);
    font:inherit; font-size:.8rem; padding:6px 14px; border-radius:5px; cursor:pointer; text-decoration:none; }
  nav button:hover, nav a:hover, #zv button:hover { background:rgba(223,163,92,.18); }
  #pagenum { font-size:.8rem; color:var(--or); min-width:88px; text-align:center; }
  /* ---- Zoom / lecture ---- */
  #zv { position:fixed; inset:0; background:rgba(20,14,24,.96); display:none; z-index:50;
        flex-direction:column; }
  #zv.open { display:flex; }
  #zv-bar { display:flex; gap:8px; align-items:center; justify-content:center; padding:10px; flex-wrap:wrap; }
  #zv-num { font-size:.8rem; color:var(--or); min-width:70px; text-align:center; }
  #zv-view { flex:1; overflow:hidden; position:relative; cursor:grab; }
  #zv-view.dragging { cursor:grabbing; }
  #zv-img { position:absolute; top:0; left:0; transform-origin:0 0; user-select:none; -webkit-user-drag:none;
            box-shadow:0 8px 40px rgba(0,0,0,.6); }
  #zv-hint { text-align:center; font-size:.68rem; color:var(--or); opacity:.7; padding:6px; }
  /* ---- Panneau sommaire / recherche ---- */
  #panel { position:fixed; top:0; left:0; bottom:0; width:min(380px, 92vw); background:#241C28;
           border-right:1px solid var(--or); z-index:60; display:none; flex-direction:column;
           box-shadow:12px 0 40px rgba(0,0,0,.5); }
  #panel.open { display:flex; }
  #panel-bar { display:flex; gap:8px; align-items:center; padding:12px; border-bottom:1px solid rgba(223,163,92,.35); }
  #panel-bar input { flex:1; background:rgba(244,237,220,.08); border:1px solid rgba(223,163,92,.5);
    color:var(--parchemin); font:inherit; font-size:.85rem; padding:7px 10px; border-radius:5px; outline:none; }
  #panel-bar input::placeholder { color:rgba(244,237,220,.45); }
  #panel-bar button { background:transparent; border:1px solid var(--or); color:var(--parchemin);
    font:inherit; font-size:.8rem; padding:6px 10px; border-radius:5px; cursor:pointer; }
  #panel-list { flex:1; overflow-y:auto; padding:8px 0 20px; }
  .toc-item { padding:7px 16px; cursor:pointer; font-size:.85rem; display:flex; gap:10px; }
  .toc-item:hover { background:rgba(223,163,92,.14); }
  .toc-item .pg { margin-left:auto; color:var(--or); font-size:.75rem; }
  .toc-l1 { text-transform:uppercase; letter-spacing:.08em; color:var(--or); margin-top:8px; font-size:.78rem; }
  .toc-l2 { padding-left:30px; }
  .hit { padding:8px 16px; cursor:pointer; border-bottom:1px solid rgba(244,237,220,.06); }
  .hit:hover { background:rgba(223,163,92,.14); }
  .hit .pg { color:var(--or); font-size:.75rem; }
  .hit .snip { font-size:.78rem; color:rgba(244,237,220,.75); margin-top:2px; }
  .hit .snip b { color:var(--parchemin); font-weight:bold; background:rgba(223,163,92,.25); }
  #panel-empty { padding:16px; font-size:.8rem; color:rgba(244,237,220,.5); }
</style>
</head>
<body>
<header>
  <h1>Skill<b>Quest</b> — La quête des compétences</h1>
  <p>Édition 2026-2027 · APEX — UniLaSalle</p>
</header>
<div id="book-wrap"><div id="book"></div></div>
<nav>
  <button id="toc-btn">☰ Sommaire</button>
  <button id="prev">◀ Précédent</button>
  <span id="pagenum">…</span>
  <button id="next">Suivant ▶</button>
  <button id="zoom">🔍 Zoom lecture</button>
  <button id="fs">Plein écran</button>
  <a href="SkillQuest-2026-27.pdf" download>Télécharger le PDF</a>
</nav>

<div id="panel">
  <div id="panel-bar">
    <input id="q" type="search" placeholder="Rechercher dans le livre…" autocomplete="off">
    <button id="panel-close">✕</button>
  </div>
  <div id="panel-list"></div>
</div>

<div id="zv">
  <div id="zv-bar">
    <button id="zv-prev">◀</button>
    <span id="zv-num">…</span>
    <button id="zv-next">▶</button>
    <button id="zv-minus">−</button>
    <button id="zv-plus">+</button>
    <button id="zv-fit">Ajuster</button>
    <button id="zv-close">✕ Fermer</button>
  </div>
  <div id="zv-view"><img id="zv-img" alt="page"></div>
  <div id="zv-hint">Molette ou boutons +/− pour zoomer · cliquer-glisser pour se déplacer · ←/→ pour changer de page · Échap pour fermer</div>
</div>

<script src="searchdata.js"></script>
<script>
const N = 103, ratio = 210/297, PREFIX = '';
const src = i => `${PREFIX}page-${String(i+1).padStart(3,'0')}.jpg`; // i = index 0-based
const pages = Array.from({length:N}, (_,i)=>src(i));
function dims(){
  const availH = Math.max(320, window.innerHeight - 150);
  const availW = Math.max(300, window.innerWidth - 24);
  let h = availH, w = h*ratio;
  if (2*w > availW){ w = Math.min(availW/2, availW); h = w/ratio; }
  if (availW < 640){ w = Math.min(availW, availH*ratio); h = w/ratio; }
  return {w:Math.floor(w), h:Math.floor(h)};
}
const d = dims();
const flip = new St.PageFlip(document.getElementById('book'), {
  width:d.w, height:d.h, size:'fixed', showCover:true, maxShadowOpacity:.4,
  usePortrait:true, mobileScrollSupport:false, flippingTime:650
});
flip.loadFromImages(pages);
const label = ()=>{ document.getElementById('pagenum').textContent =
  `${flip.getCurrentPageIndex()+1} / ${N}`; };
flip.on('flip', label); setTimeout(label, 300);
document.getElementById('prev').onclick = ()=>flip.flipPrev();
document.getElementById('next').onclick = ()=>flip.flipNext();
document.getElementById('fs').onclick = ()=>{
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); };

/* ---------- Zoom lecture ---------- */
const zv = document.getElementById('zv'), zview = document.getElementById('zv-view'),
      zimg = document.getElementById('zv-img'), znum = document.getElementById('zv-num');
let zp = 0, scale = 1, minScale = 1, tx = 0, ty = 0, natW = 1654, natH = 2339;
function apply(){ zimg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
function clampPan(){
  const vw = zview.clientWidth, vh = zview.clientHeight, w = natW*scale, h = natH*scale;
  tx = w <= vw ? (vw-w)/2 : Math.min(0, Math.max(vw-w, tx));
  ty = h <= vh ? (vh-h)/2 : Math.min(0, Math.max(vh-h, ty));
}
function fit(){
  const vw = zview.clientWidth, vh = zview.clientHeight;
  minScale = Math.min(vw/natW, vh/natH);
  scale = minScale; tx = (vw-natW*scale)/2; ty = (vh-natH*scale)/2; apply();
}
function showPage(i){
  zp = Math.max(0, Math.min(N-1, i));
  znum.textContent = `${zp+1} / ${N}`;
  zimg.onload = ()=>{ natW = zimg.naturalWidth; natH = zimg.naturalHeight; fit(); };
  zimg.src = src(zp);
}
function openZoom(){ zv.classList.add('open'); showPage(flip.getCurrentPageIndex()); }
function closeZoom(){ zv.classList.remove('open'); }
function zoomAt(f, cx, cy){
  const ns = Math.max(minScale, Math.min(minScale*5, scale*f));
  tx = cx - (cx - tx) * (ns/scale); ty = cy - (cy - ty) * (ns/scale);
  scale = ns; clampPan(); apply();
}
document.getElementById('zoom').onclick = openZoom;
document.getElementById('book').addEventListener('dblclick', openZoom);
document.getElementById('zv-close').onclick = closeZoom;
document.getElementById('zv-prev').onclick = ()=>showPage(zp-1);
document.getElementById('zv-next').onclick = ()=>showPage(zp+1);
document.getElementById('zv-plus').onclick  = ()=>zoomAt(1.35, zview.clientWidth/2, zview.clientHeight/2);
document.getElementById('zv-minus').onclick = ()=>zoomAt(1/1.35, zview.clientWidth/2, zview.clientHeight/2);
document.getElementById('zv-fit').onclick = fit;
zview.addEventListener('wheel', e=>{ e.preventDefault();
  const r = zview.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.18 : 1/1.18, e.clientX - r.left, e.clientY - r.top);
}, {passive:false});
let drag = null;
zview.addEventListener('pointerdown', e=>{ drag = {x:e.clientX-tx, y:e.clientY-ty};
  zview.classList.add('dragging'); zview.setPointerCapture(e.pointerId); });
zview.addEventListener('pointermove', e=>{ if(!drag) return;
  tx = e.clientX-drag.x; ty = e.clientY-drag.y; clampPan(); apply(); });
zview.addEventListener('pointerup', ()=>{ drag = null; zview.classList.remove('dragging'); });
zimg.addEventListener('dblclick', e=>{ const r = zview.getBoundingClientRect();
  zoomAt(scale <= minScale*1.05 ? 2.2 : 0.01, e.clientX - r.left, e.clientY - r.top); });
window.addEventListener('resize', ()=>{ if (zv.classList.contains('open')) fit(); });

/* ---------- Sommaire et recherche ---------- */
const panel = document.getElementById('panel'), plist = document.getElementById('panel-list'),
      q = document.getElementById('q');
const deacc = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function goTo(pdfPage){ panel.classList.remove('open'); flip.turnToPage(Math.max(0, Math.min(N-1, pdfPage-1))); label(); }
function renderTOC(){
  plist.innerHTML = '';
  (SQDATA.toc||[]).forEach(([lvl,title,page])=>{
    const div = document.createElement('div');
    div.className = 'toc-item toc-l'+lvl;
    div.innerHTML = `<span>${title}</span><span class="pg">${page}</span>`;
    div.onclick = ()=>goTo(page);
    plist.appendChild(div);
  });
}
function renderSearch(term){
  plist.innerHTML = '';
  const t = deacc(term); let n = 0;
  SQDATA.txt.forEach((txt,i)=>{
    const k = txt.indexOf(t);
    if (k < 0 || n >= 60) return;
    n++;
    const raw = SQDATA.raw[i];
    const a = Math.max(0, k-55), b = Math.min(raw.length, k+t.length+55);
    const snip = (a>0?'…':'') + raw.slice(a,k) + '<b>' + raw.slice(k,k+t.length) + '</b>' + raw.slice(k+t.length,b) + (b<raw.length?'…':'');
    const div = document.createElement('div');
    div.className = 'hit';
    div.innerHTML = `<span class="pg">p. ${i+1}</span><div class="snip">${snip}</div>`;
    div.onclick = ()=>goTo(i+1);
    plist.appendChild(div);
  });
  if (!n) plist.innerHTML = '<div id="panel-empty">Aucun résultat.</div>';
}
q.addEventListener('input', ()=>{ q.value.trim().length >= 3 ? renderSearch(q.value.trim()) : renderTOC(); });
document.getElementById('toc-btn').onclick = ()=>{ panel.classList.toggle('open');
  if (panel.classList.contains('open')){ renderTOC(); q.value=''; q.focus(); } };
document.getElementById('panel-close').onclick = ()=>panel.classList.remove('open');

document.addEventListener('keydown', e=>{
  if (panel.classList.contains('open')){ if (e.key==='Escape') panel.classList.remove('open'); return; }
  if (zv.classList.contains('open')){
    if (e.key==='Escape') closeZoom();
    if (e.key==='ArrowRight') showPage(zp+1);
    if (e.key==='ArrowLeft') showPage(zp-1);
    return;
  }
  if (e.key==='ArrowRight'||e.key==='PageDown') flip.flipNext();
  if (e.key==='ArrowLeft'||e.key==='PageUp') flip.flipPrev();
});
</script>
</body>
</html>
